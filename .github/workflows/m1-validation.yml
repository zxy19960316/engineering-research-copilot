          git merge-base --is-ancestor fedc5cdeebd7a2943afeb6767d39841305c55444 HEAD
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/build_m4_1_preparation.py
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/audit_m4_1_preparation.py
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/execution/prepare_m4_1_request_bundles.ps1
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/revisions/m4.1/preparation-manifest.json
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/revisions/m4.1/preparation-manifest.schema.json
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:tests/test_m4_1_preparation.py
          git diff --raw --exit-code fedc5cdeebd7a2943afeb6767d39841305c55444 HEAD -- evals/m4/build_m4_1_preparation.py evals/m4/audit_m4_1_preparation.py evals/m4/execution/prepare_m4_1_request_bundles.ps1 evals/m4/revisions/m4.1/preparation-manifest.json evals/m4/revisions/m4.1/preparation-manifest.schema.json tests/test_m4_1_preparation.py
          git diff --exit-code fedc5cdeebd7a2943afeb6767d39841305c55444 HEAD -- evals/m4/build_m4_1_preparation.py evals/m4/audit_m4_1_preparation.py evals/m4/execution/prepare_m4_1_request_bundles.ps1 evals/m4/revisions/m4.1/preparation-manifest.json evals/m4/revisions/m4.1/preparation-manifest.schema.json tests/test_m4_1_preparation.py
          git cat-file -e '4fe3785ffd4db9cbf966d8c7ec1451079717da24^{commit}'
          git merge-base --is-ancestor 4fe3785ffd4db9cbf966d8c7ec1451079717da24 HEAD
          git cat-file -e 'e38f3fc2305efefb070e3be20413c55156e8b186^{blob}'
          git cat-file -e 4fe3785ffd4db9cbf966d8c7ec1451079717da24:evals/m4/authorization/m4.1/gate-iv-review.json
          git diff --raw --exit-code 4fe3785ffd4db9cbf966d8c7ec1451079717da24 HEAD -- evals/m4/authorization/m4.1/gate-iv-review.json
          git diff --exit-code 4fe3785ffd4db9cbf966d8c7ec1451079717da24 HEAD -- evals/m4/authorization/m4.1/gate-iv-review.json
          git cat-file -e '5d781ea352e67ab44631844c37cf9b6552cfce77^{commit}'
          git merge-base --is-ancestor 5d781ea352e67ab44631844c37cf9b6552cfce77 HEAD
          git cat-file -e 5d781ea352e67ab44631844c37cf9b6552cfce77:evals/m4/authorization/m4.1/execution-authorization.schema.json
          git cat-file -e 5d781ea352e67ab44631844c37cf9b6552cfce77:evals/m4/authorization/m4.1/execution-control.schema.json
          git diff --raw --exit-code 5d781ea352e67ab44631844c37cf9b6552cfce77 HEAD -- evals/m4/authorization/m4.1/execution-authorization.schema.json evals/m4/authorization/m4.1/execution-control.schema.json
