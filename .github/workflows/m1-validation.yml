name: M1, M2.1.1, and M3.1.1 Validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: |
          python -m py_compile \
            skills/engineering-research-copilot/scripts/validate_m1_bundle.py \
            skills/engineering-research-copilot/scripts/render_m1_map.py \
            skills/engineering-research-copilot/scripts/validate_citation_gate.py \
            skills/engineering-research-copilot/scripts/validate_m2_direction_bundle.py \
            evals/m1/replay_offline_results.py \
            evals/m1/replay_machine_artifacts.py \
            evals/m2/build_fixtures.py \
            evals/m2/build_forward_case_f.py \
            evals/m2/replay_offline_results.py \
            skills/engineering-research-copilot/scripts/validate_m3_method_bundle.py \
            evals/m3/build_fixtures.py \
            evals/m3/replay_offline_results.py \
            evals/m3/run_forward_validation_once.py \
            evals/m3/audit_forward_inputs.py \
            evals/m3/audit_forward_acceptance.py \
            evals/m3/audit_skill_package.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Replay fixtures
        run: python evals/m1/replay_offline_results.py
      - name: Replay machine artifacts
        run: python evals/m1/replay_machine_artifacts.py
      - name: Generate M2.1.1 fixtures
        run: python evals/m2/build_fixtures.py
      - name: Require M2.1.1 fixture regeneration diff to be empty
        run: git diff --exit-code -- evals/m2/adversarial-cases.json evals/m2/fixtures
      - name: Replay M2.1.1 frozen fixtures
        run: python evals/m2/replay_offline_results.py
      - name: Generate M3.1 fixtures
        run: python evals/m3/build_fixtures.py
      - name: Require M3.1 fixture regeneration diff to be empty
        run: git diff --exit-code -- evals/m3/adversarial-cases.json evals/m3/fixtures
      - name: Replay M3.1 frozen fixtures
        run: python evals/m3/replay_offline_results.py
      - name: Tracked M3.1 package audit
        run: python evals/m3/audit_skill_package.py
      - name: Audit M3 forward input prerequisites
        run: python evals/m3/audit_forward_inputs.py evals/m3/forward-inputs-r2/manifest.json
      - name: Audit M3 fresh acceptance
        run: python evals/m3/audit_forward_acceptance.py evals/m3/results/forward-r2/acceptance-manifest.json
