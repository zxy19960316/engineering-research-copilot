name: M1, M2.1.1, M3.1.1, and M4 Validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: |
          python -m py_compile \
            skills/engineering-research-copilot/scripts/validate_m1_bundle.py \
            skills/engineering-research-copilot/scripts/render_m1_map.py \
            skills/engineering-research-copilot/scripts/validate_citation_gate.py \
            skills/engineering-research-copilot/scripts/validate_m2_direction_bundle.py \
            evals/m1/replay_offline_results.py \
            evals/m1/replay_machine_artifacts.py \
            evals/m2/build_fixtures.py \
            evals/m2/build_forward_case_f.py \
            evals/m2/replay_offline_results.py \
            skills/engineering-research-copilot/scripts/validate_m3_method_bundle.py \
            skills/engineering-research-copilot/scripts/compose_m3_bundle.py \
            evals/m3/build_fixtures.py \
            evals/m3/replay_offline_results.py \
            evals/m3/run_forward_validation_once.py \
            evals/m3/audit_forward_case_input.py \
            evals/m3/validate_m3_forward_outcome.py \
            evals/m3/run_forward_outcome_validation_once.py \
            evals/m3/dispatch_forward_r4.py \
            evals/m3/r5_dispatch_contract.py \
            evals/m3/dispatch_forward_r5.py \
            evals/m3/consume_forward_r5_once.py \
            evals/m3/audit_forward_inputs.py \
            evals/m3/diagnose_forward_input_hashes.py \
            evals/m3/audit_m3_r5_1_ci_state.py \
            evals/m3/audit_forward_acceptance.py \
            evals/m3/audit_forward_r4_preparation.py \
            evals/m3/audit_forward_r5_acceptance.py \
            evals/m3/audit_forward_r5_1_f02_preparation.py \
            evals/m3/audit_forward_r5_1_f02_authorization.py \
            evals/m3/dispatch_forward_r5_1_f02.py \
            evals/m3/r5_1_f02_execution_contract.py \
            evals/m3/audit_forward_r5_1_f02_execution_authorization.py \
            evals/m3/dispatch_forward_r5_1_f02_once.py \
            evals/m3/r5_1_f02_terminal_contract.py \
            evals/m3/audit_forward_r5_1_f02_terminal.py \
            evals/m3/r5_2_f02_protocol.py \
            evals/m3/audit_forward_r5_2_f02_preparation.py \
            evals/m3/dispatch_forward_r5_2_f02.py \
            evals/m3/r5_2_f02_execution_contract.py \
            evals/m3/audit_forward_r5_2_f02_execution_authorization.py \
            evals/m3/dispatch_forward_r5_2_f02_once.py \
            evals/m3/consume_forward_r5_2_f02_once.py \
            evals/m3/audit_forward_r5_2_f02_terminal.py \
            evals/m3/m3_cross_revision_contract.py \
            evals/m3/audit_forward_r5_2_aggregate.py \
            evals/m3/audit_m3_closure.py \
            evals/m3/audit_immutable_forward_evidence.py \
            evals/m3/audit_skill_package.py \
            evals/m4/variants/build_variants.py \
            evals/m4/build_preparation.py \
            evals/m4/audit_preparation.py \
            evals/m4/audit_results.py \
            evals/m4/authorization/build_authorization.py \
            evals/m4/authorization/audit_authorization.py \
            evals/m4/execution/audit_m4_0.py \
            evals/m4/build_m4_1_preparation.py \
            evals/m4/audit_m4_1_preparation.py \
            evals/m4/authorization/build_m4_1_authorization.py \
            evals/m4/authorization/audit_m4_1_authorization.py \
            evals/m4/execution/audit_m4_1.py \
            evals/m4/execution/build_m4_1_launch_claim.py \
            evals/m4/execution/record_m4_1_execution_evidence.py \
            evals/m4/execution/audit_m4_1_launch_readiness.py \
            evals/m4/execution/audit_m4_1_terminal.py
      - name: Require immutable r5 evidence commit
        run: |
          git cat-file -e 1b696bce53ee0a11163bfe4f91a9a49ab3af6f49^{commit}
          git cat-file -e 1b696bce53ee0a11163bfe4f91a9a49ab3af6f49:evals/m3/results/forward-r5/acceptance-manifest-consumed.json
      - name: Require green M4.0 terminal baseline to be an ancestor
        run: |
          git cat-file -e 'f48ab8d7e835e9a57e65b75458faa786d696316d^{commit}'
          git merge-base --is-ancestor f48ab8d7e835e9a57e65b75458faa786d696316d HEAD
      - name: Require green M4.1 preparation baseline to be an ancestor
        run: |
          git cat-file -e 'fedc5cdeebd7a2943afeb6767d39841305c55444^{commit}'
          git merge-base --is-ancestor fedc5cdeebd7a2943afeb6767d39841305c55444 HEAD
      - name: Require M4.1 preparation artifacts to remain blob-identical
        run: |
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/build_m4_1_preparation.py
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/audit_m4_1_preparation.py
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/execution/prepare_m4_1_request_bundles.ps1
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/revisions/m4.1/preparation-manifest.json
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:evals/m4/revisions/m4.1/preparation-manifest.schema.json
          git cat-file -e fedc5cdeebd7a2943afeb6767d39841305c55444:tests/test_m4_1_preparation.py
          git diff --raw --exit-code fedc5cdeebd7a2943afeb6767d39841305c55444 HEAD -- evals/m4/build_m4_1_preparation.py evals/m4/audit_m4_1_preparation.py evals/m4/execution/prepare_m4_1_request_bundles.ps1 evals/m4/revisions/m4.1/preparation-manifest.json evals/m4/revisions/m4.1/preparation-manifest.schema.json tests/test_m4_1_preparation.py
          git diff --exit-code fedc5cdeebd7a2943afeb6767d39841305c55444 HEAD -- evals/m4/build_m4_1_preparation.py evals/m4/audit_m4_1_preparation.py evals/m4/execution/prepare_m4_1_request_bundles.ps1 evals/m4/revisions/m4.1/preparation-manifest.json evals/m4/revisions/m4.1/preparation-manifest.schema.json tests/test_m4_1_preparation.py
      - name: Require independent M4.1 review to remain blob-identical
        run: |
          git cat-file -e '4fe3785ffd4db9cbf966d8c7ec1451079717da24^{commit}'
          git merge-base --is-ancestor 4fe3785ffd4db9cbf966d8c7ec1451079717da24 HEAD
          git cat-file -e 'e38f3fc2305efefb070e3be20413c55156e8b186^{blob}'
          git cat-file -e 4fe3785ffd4db9cbf966d8c7ec1451079717da24:evals/m4/authorization/m4.1/gate-iv-review.json
          git diff --raw --exit-code 4fe3785ffd4db9cbf966d8c7ec1451079717da24 HEAD -- evals/m4/authorization/m4.1/gate-iv-review.json
          git diff --exit-code 4fe3785ffd4db9cbf966d8c7ec1451079717da24 HEAD -- evals/m4/authorization/m4.1/gate-iv-review.json
      - name: Require M4.1 authorization schemas to remain blob-identical
        run: |
          git cat-file -e '5d781ea352e67ab44631844c37cf9b6552cfce77^{commit}'
          git merge-base --is-ancestor 5d781ea352e67ab44631844c37cf9b6552cfce77 HEAD
          git cat-file -e 5d781ea352e67ab44631844c37cf9b6552cfce77:evals/m4/authorization/m4.1/execution-authorization.schema.json
          git cat-file -e 5d781ea352e67ab44631844c37cf9b6552cfce77:evals/m4/authorization/m4.1/execution-control.schema.json
          git diff --raw --exit-code 5d781ea352e67ab44631844c37cf9b6552cfce77 HEAD -- evals/m4/authorization/m4.1/execution-authorization.schema.json evals/m4/authorization/m4.1/execution-control.schema.json
          git diff --exit-code 5d781ea352e67ab44631844c37cf9b6552cfce77 HEAD -- evals/m4/authorization/m4.1/execution-authorization.schema.json evals/m4/authorization/m4.1/execution-control.schema.json
      - name: Require M4.1 authorization delivery HEAD and artifacts to remain preserved
        run: |
          git cat-file -e 'ae1ad43cca52ae450e146e952e3b108792b2b665^{commit}'
          git merge-base --is-ancestor ae1ad43cca52ae450e146e952e3b108792b2b665 HEAD
          git diff --raw --exit-code ae1ad43cca52ae450e146e952e3b108792b2b665 HEAD -- evals/m4/authorization/m4.1/gate-iv-review.json evals/m4/authorization/m4.1/execution-authorization.schema.json evals/m4/authorization/m4.1/execution-control.schema.json evals/m4/authorization/m4.1/execution-authorization.json evals/m4/authorization/m4.1/execution-control.json evals/m4/authorization/build_m4_1_authorization.py evals/m4/authorization/audit_m4_1_authorization.py tests/test_m4_1_authorization_builder.py tests/test_m4_1_authorization.py
          git diff --exit-code ae1ad43cca52ae450e146e952e3b108792b2b665 HEAD -- evals/m4/authorization/m4.1/gate-iv-review.json evals/m4/authorization/m4.1/execution-authorization.schema.json evals/m4/authorization/m4.1/execution-control.schema.json evals/m4/authorization/m4.1/execution-authorization.json evals/m4/authorization/m4.1/execution-control.json evals/m4/authorization/build_m4_1_authorization.py evals/m4/authorization/audit_m4_1_authorization.py tests/test_m4_1_authorization_builder.py tests/test_m4_1_authorization.py
      - name: Current lifecycle unit tests
        run: >-
          python -X utf8 -c "import pathlib, sys, unittest;
          excluded = {'test_m4_1_preparation', 'test_m4_1_authorization_builder',
          'test_m4_1_authorization', 'test_m4_1_execution',
          'test_m4_1_launch_readiness'};
          modules = ['tests.' + path.stem for path in
          sorted(pathlib.Path('tests').glob('test_*.py')) if path.stem not in excluded];
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules);
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          sys.exit(0 if result.wasSuccessful() else 1)"
      - name: Replay fixtures
        run: python evals/m1/replay_offline_results.py
      - name: Replay machine artifacts
        run: python evals/m1/replay_machine_artifacts.py
      - name: Generate M2.1.1 fixtures
        run: python evals/m2/build_fixtures.py
      - name: Require M2.1.1 fixture regeneration diff to be empty
        run: git diff --exit-code -- evals/m2/adversarial-cases.json evals/m2/fixtures
      - name: Replay M2.1.1 frozen fixtures
        run: python evals/m2/replay_offline_results.py
      - name: Generate M3.1 fixtures
        run: python evals/m3/build_fixtures.py
      - name: Require M3.1 fixture regeneration diff to be empty
        run: git diff --exit-code -- evals/m3/adversarial-cases.json evals/m3/fixtures
      - name: Replay M3.1 frozen fixtures
        run: python evals/m3/replay_offline_results.py
      - name: Tracked M3.1 package audit
        run: python evals/m3/audit_skill_package.py
      - name: Audit historical prerequisites and current r5 blocked acceptance
        run: python evals/m3/audit_m3_r5_1_ci_state.py
      - name: Audit r5.1-f02 terminal one-shot evidence
        run: python evals/m3/audit_forward_r5_1_f02_terminal.py
      - name: Audit r5.2-f02 terminal one-shot evidence
        run: python evals/m3/audit_forward_r5_2_f02_terminal.py
      - name: Audit accepted r5 and r5.2 cross-revision aggregate
        run: python -X utf8 evals/m3/audit_forward_r5_2_aggregate.py
      - name: Audit M3 cross-revision closure
        run: python -X utf8 evals/m3/audit_m3_closure.py
      - name: Require M4 variant regeneration diff to be empty
        run: python -X utf8 evals/m4/variants/build_variants.py --check
      - name: Require M4 preparation regeneration diff to be empty
        run: python -X utf8 evals/m4/build_preparation.py --check
      - name: Audit M4 preparation
        run: python -X utf8 evals/m4/audit_preparation.py
      - name: Require shared and M4.0 terminal artifacts to remain unchanged
        run: git diff --raw --exit-code f48ab8d7e835e9a57e65b75458faa786d696316d HEAD -- evals/m3 skills/engineering-research-copilot evals/m4/cases evals/m4/variants evals/m4/schemas evals/m4/preparation-manifest.json evals/m4/build_preparation.py evals/m4/audit_preparation.py evals/m4/audit_results.py evals/m4/task-protocol.md evals/m4/judge-rubric.json tests/test_m4_preparation.py tests/test_m4_results.py evals/m4/authorization/gate-iv-review.json evals/m4/authorization/execution-authorization.json evals/m4/authorization/execution-control.json evals/m4/authorization/build_authorization.py evals/m4/authorization/audit_authorization.py evals/m4/authorization/execution-authorization.schema.json evals/m4/authorization/execution-control.schema.json tests/test_m4_authorization.py evals/m4/execution/m4.0/launch-claim.json evals/m4/execution/m4.0/pre-dispatch-failure.json evals/m4/execution/audit_m4_0.py tests/test_m4_execution.py
      - name: Require consumed M4 authorization artifacts to remain unchanged
        run: git diff --exit-code e3542201f96218f340a09f77458661822c98d876 HEAD -- evals/m4/authorization/gate-iv-review.json evals/m4/authorization/execution-authorization.json evals/m4/authorization/execution-control.json
      - name: Audit M4.0 pre-dispatch failure is preserved
        run: python -X utf8 evals/m4/execution/audit_m4_0.py
      - name: Require green M4.1 Gate IV-A protocol baseline to remain frozen
        run: |
          git cat-file -e 'bb1b8a5e4bab46d625c637d564d8132dc69a21ab^{commit}'
          git merge-base --is-ancestor bb1b8a5e4bab46d625c637d564d8132dc69a21ab HEAD
          git diff --raw --exit-code bb1b8a5e4bab46d625c637d564d8132dc69a21ab HEAD -- docs/superpowers/plans/2026-08-08-m4.1-gate-iv-fresh-execution.md evals/m4/execution/m4.1/launch-claim.schema.json evals/m4/execution/m4.1/dispatch-receipt.schema.json evals/m4/execution/m4.1/execution-terminal.schema.json evals/m4/execution/audit_m4_1.py tests/test_m4_1_execution.py
          git diff --exit-code bb1b8a5e4bab46d625c637d564d8132dc69a21ab HEAD -- docs/superpowers/plans/2026-08-08-m4.1-gate-iv-fresh-execution.md evals/m4/execution/m4.1/launch-claim.schema.json evals/m4/execution/m4.1/dispatch-receipt.schema.json evals/m4/execution/m4.1/execution-terminal.schema.json evals/m4/execution/audit_m4_1.py tests/test_m4_1_execution.py
      - name: Require green M4.1 Gate IV-B predecessor baseline to remain frozen
        run: |
          git cat-file -e 'c370a3ce21661f0dbf2cdd153b8761d8fce71f9b^{commit}'
          git merge-base --is-ancestor c370a3ce21661f0dbf2cdd153b8761d8fce71f9b HEAD
          git diff --raw --exit-code c370a3ce21661f0dbf2cdd153b8761d8fce71f9b HEAD -- docs/superpowers/plans/2026-08-08-m4.1-gate-iv-b-launch-readiness.md evals/m4/execution/m4.1/gate-iv-b-review.json evals/m4/execution/build_m4_1_launch_claim.py evals/m4/execution/record_m4_1_execution_evidence.py evals/m4/execution/audit_m4_1_launch_readiness.py tests/test_m4_1_launch_readiness.py
          git diff --exit-code c370a3ce21661f0dbf2cdd153b8761d8fce71f9b HEAD -- docs/superpowers/plans/2026-08-08-m4.1-gate-iv-b-launch-readiness.md evals/m4/execution/m4.1/gate-iv-b-review.json evals/m4/execution/build_m4_1_launch_claim.py evals/m4/execution/record_m4_1_execution_evidence.py evals/m4/execution/audit_m4_1_launch_readiness.py tests/test_m4_1_launch_readiness.py
      - name: Require M4.1 claim and terminal evidence to remain byte-identical
        run: |
          git cat-file -e '80b54697c3e27a5dad0a24d5318ce26c8fe46141^{commit}'
          git merge-base --is-ancestor 80b54697c3e27a5dad0a24d5318ce26c8fe46141 HEAD
          git diff --raw --exit-code 80b54697c3e27a5dad0a24d5318ce26c8fe46141 HEAD -- evals/m4/execution/m4.1/launch-claim.json evals/m4/execution/m4.1/execution-terminal.json
          git diff --exit-code 80b54697c3e27a5dad0a24d5318ce26c8fe46141 HEAD -- evals/m4/execution/m4.1/launch-claim.json evals/m4/execution/m4.1/execution-terminal.json
      - name: Audit M4.1 stopped terminal preservation
        run: |
          python -X utf8 -m unittest tests.test_m4_1_terminal -v
          python -X utf8 evals/m4/execution/audit_m4_1_terminal.py
      - name: Assert M4.1 authorization is consumed exactly once
        run: >-
          python -X utf8 -c "import json, pathlib;
          claim = json.loads(pathlib.Path('evals/m4/execution/m4.1/launch-claim.json').read_text(encoding='utf-8'));
          assert claim['claim_count'] == 1, claim['claim_count'];
          assert claim['authorization']['token_status_after_claim'] == 'CONSUMED', claim['authorization']"
      - name: Assert M4.1 execution and result state remains zero
        run: >-
          python -X utf8 -c "import json, pathlib;
          terminal = json.loads(pathlib.Path('evals/m4/execution/m4.1/execution-terminal.json').read_text(encoding='utf-8'));
          zero = {'tasks', 'threads', 'finalizations', 'attempts', 'retries', 'repairs', 'followups', 'results', 'judge_calls', 'aggregation_calls', 'side_effects'};
          assert all(terminal['counts'][name] == 0 for name in zero), terminal['counts'];
          assert terminal['attempted_task_ids'] == terminal['dispatch_receipts'] == terminal['raw_finals'] == [], terminal;
          forbidden = [pathlib.Path('evals/m4/execution/m4.1/platform-observations'), pathlib.Path('evals/m4/results/m4.1'), pathlib.Path('evals/m4/results-manifest.json')];
          present = [path.as_posix() for path in forbidden if path.exists()];
          assert not present, present"
      - name: Assert M4 results remain not run
        run: python -X utf8 evals/m4/audit_results.py --expect-not-run

  m4-1-preclaim-regression:
    name: M4.1 pre-claim regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create isolated green pre-claim worktree
        run: git -c core.autocrlf=false worktree add --detach "${{ runner.temp }}/m4-1-preclaim" c370a3ce21661f0dbf2cdd153b8761d8fce71f9b
      - name: Validate predecessor preparation authorization execution and readiness
        working-directory: ${{ runner.temp }}/m4-1-preclaim
        run: |
          python -X utf8 -m unittest tests.test_m4_1_preparation tests.test_m4_1_authorization_builder tests.test_m4_1_authorization tests.test_m4_1_execution tests.test_m4_1_launch_readiness -v
          python -X utf8 evals/m4/build_m4_1_preparation.py --check
          python -X utf8 evals/m4/audit_m4_1_preparation.py
          python -X utf8 evals/m4/authorization/build_m4_1_authorization.py --check
          python -X utf8 evals/m4/authorization/audit_m4_1_authorization.py --configured-model gpt-5.6-sol --configured-reasoning-effort max --require-configured-defaults
          python -X utf8 evals/m4/execution/audit_m4_1.py
          python -X utf8 evals/m4/execution/build_m4_1_launch_claim.py --check
          python -X utf8 evals/m4/execution/record_m4_1_execution_evidence.py --check
          python -X utf8 evals/m4/execution/audit_m4_1_launch_readiness.py
          python -X utf8 -c "from pathlib import Path; forbidden = [Path('evals/m4/execution/m4.1/launch-claim.json'), Path('evals/m4/execution/m4.1/execution-terminal.json'), Path('evals/m4/execution/m4.1/platform-observations'), Path('evals/m4/results/m4.1'), Path('evals/m4/results-manifest.json')]; present = [path.as_posix() for path in forbidden if path.exists()]; assert not present, present"
      - name: Verify predecessor request preflight with PowerShell 7
        if: runner.os == 'Linux'
        shell: pwsh
        working-directory: ${{ runner.temp }}/m4-1-preclaim
        run: |
          ./evals/m4/execution/prepare_m4_1_request_bundles.ps1 -SelfTest
          ./evals/m4/execution/prepare_m4_1_request_bundles.ps1 -CheckAll
      - name: Verify predecessor request preflight with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}/m4-1-preclaim
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'expected_windows_powershell_5_1' }
          .\evals\m4\execution\prepare_m4_1_request_bundles.ps1 -SelfTest
          .\evals\m4\execution\prepare_m4_1_request_bundles.ps1 -CheckAll
      - name: Remove isolated green pre-claim worktree
        if: always()
        run: git worktree remove --force "${{ runner.temp }}/m4-1-preclaim"

  historical-audit-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit historical M3 M4.0 and current M4.1 terminal on LF and CRLF worktrees
        run: |
          python -X utf8 -m unittest tests.test_audit_m3_forward_inputs -v
          python -X utf8 -m unittest tests.test_audit_m3_forward_r5_2_f02_preparation -v
          python -X utf8 -m unittest tests.test_audit_m3_forward_r5_2_f02_execution_authorization -v
          python -X utf8 -m unittest tests.test_audit_m3_forward_r5_2_f02_terminal -v
