name: M4.2 Gate A source export

on:
  push:
    branches:
      - codex/m4-cross-engineering-forward-evaluation-m4.2-one-shot-claim-and-execution
    paths:
      - .github/workflows/m4-2-gate-a-source-export.yml

permissions:
  contents: read

concurrency:
  group: m4-2-gate-a-source-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle full repository history and verify exact accepted source head
        shell: bash
        env:
          SOURCE_HEAD: 8ffc4b53f79a5018588703c562945d9240506990
          SOURCE_TREE: 047c30a5c07308f620fda31d3b6c787953d738be
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git cat-file -e "${SOURCE_HEAD}^{commit}"
          test "$(git rev-parse "${SOURCE_HEAD}^{tree}")" = "$SOURCE_TREE"
          bundle="${RUNNER_TEMP}/engineering-research-copilot-full-history.bundle"
          git bundle create "$bundle" --all
          git bundle verify "$bundle"
          git clone "$bundle" "${RUNNER_TEMP}/bundle-verification"
          test "$(git -C "${RUNNER_TEMP}/bundle-verification" rev-parse "${SOURCE_HEAD}^{tree}")" = "$SOURCE_TREE"
          python -X utf8 - "$bundle" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          print(f"bundle={path.name} byte_length={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m4-2-gate-a-full-history
          path: ${{ runner.temp }}/engineering-research-copilot-full-history.bundle
          if-no-files-found: error
          retention-days: 1
