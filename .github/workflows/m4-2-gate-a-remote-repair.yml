name: M4.2 Gate A remote CI repair

on:
  push:
    branches:
      - codex/m4-cross-engineering-forward-evaluation-m4.2-one-shot-claim-and-execution
    paths:
      - .github/workflows/m4-2-gate-a-remote-repair.yml

permissions:
  contents: write

concurrency:
  group: m4-2-gate-a-remote-ci-repair
  cancel-in-progress: false

jobs:
  export-patched-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/m4-cross-engineering-forward-evaluation-m4.2-one-shot-claim-and-execution
      - name: Export exact patched workflow blob without updating a branch
        shell: bash
        env:
          EXPECTED_PARENT: cbe485e3b0db451f8efeb3218f682224e975ca23
          EXPECTED_WORKFLOW_BLOB: eb73c26d998968c9da3340bad90532c9a853a4a2
          TARGET_BRANCH: codex/m4-cross-engineering-forward-evaluation-m4.2-one-shot-claim-and-execution
          BLOB_TAG: m4-2-gate-a-patched-workflow-blob-20260812-v1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD:.github/workflows/m1-validation.yml)" = "$EXPECTED_WORKFLOW_BLOB"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          if git ls-remote --exit-code --tags origin "refs/tags/${BLOB_TAG}" >/dev/null 2>&1; then
            printf 'ref_already_exists:%s\n' "$BLOB_TAG" >&2
            exit 1
          fi
          python -X utf8 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/m1-validation.yml')
          token = '$' + '{{ runner.temp }}'
          old = (
              '        run: git worktree add --detach "'
              + token
              + '/m4-2-authorization-preparation-closure" '
              + '4efa75c542172a95c6c72c8c1450fea77a8e2ff1'
          ).encode('utf-8')
          new = (
              '        run: git -c core.autocrlf=false worktree add --detach "'
              + token
              + '/m4-2-authorization-preparation-closure" '
              + '4efa75c542172a95c6c72c8c1450fea77a8e2ff1'
          ).encode('utf-8')
          raw = path.read_bytes()
          if raw.count(old) != 1:
              raise SystemExit(f'expected_exact_old_line_once:{raw.count(old)}')
          if new in raw:
              raise SystemExit('replacement_already_present')
          path.write_bytes(raw.replace(old, new, 1))
          PY
          test "$(git diff --name-only)" = '.github/workflows/m1-validation.yml'
          test "$(git diff --numstat -- .github/workflows/m1-validation.yml)" = $'1\t1\t.github/workflows/m1-validation.yml'
          git diff --check
          patched_blob="$(git hash-object -w .github/workflows/m1-validation.yml)"
          git cat-file -e "${patched_blob}^{blob}"
          printf 'PATCHED_WORKFLOW_BLOB=%s\n' "$patched_blob"
          git push origin "${patched_blob}:refs/tags/${BLOB_TAG}"
